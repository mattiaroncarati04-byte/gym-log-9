<title>TheGoat</title>
<style>
:root{--bg:#F4F5F9;--card:#fff;--tx:#1B2A49;--mu:#7A8499;--ln:#E2E6EF;--ac:#F28C28;--inp:#F4F5F9;--nv:#1B2A49;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1525;--card:#18233A;--tx:#F2F4F9;--mu:#94A0B8;--ln:#2A3856;--inp:#0E1525;--nv:#18233A}}
:root[data-theme="dark"]{--bg:#0E1525;--card:#18233A;--tx:#F2F4F9;--mu:#94A0B8;--ln:#2A3856;--inp:#0E1525;--nv:#18233A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:0 14px 110px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:18px 0 4px}

.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;margin-bottom:10px}
.ghost{flex:1;padding:11px;border-radius:10px;background:transparent;border:1.5px solid var(--ln);color:var(--tx);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.sess{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.sess b{font-size:16px}.sess small{display:block;color:var(--mu);margin-top:3px;font-size:13px}
input,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--inp);border:1.5px solid var(--ln);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
.top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.lnk{background:none;color:var(--ac);font-weight:700;font-size:15px;padding:6px 0}
.dng{color:#d64545}
.two{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-bottom:6px}
.exh{display:flex;gap:8px;margin-bottom:10px}
.exn{font-weight:700}
.ic{width:42px;border-radius:10px;background:var(--inp);color:var(--mu);font-size:16px;flex:none}
.set{display:grid;grid-template-columns:26px 1fr 1fr 82px;gap:8px;align-items:center;margin-bottom:8px}
.set.hd{color:var(--mu);font-size:12px;font-weight:700;text-align:center;margin-bottom:4px}
.n{color:var(--mu);font-weight:700;text-align:center}
.set input{text-align:center;font-weight:600}

.chk.on.run{font-size:15px}
.rsl{font:inherit;font-size:13px;color:var(--tx);background:var(--inp);border:1.5px solid var(--ln);border-radius:8px;padding:3px 6px}
.chk.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;margin-top:4px}
.hint{color:var(--mu);font-size:12px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}

.empty{text-align:center;color:var(--mu);padding:30px 10px}
.lab{font-size:13px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}

.tpl b{font-size:17px;display:block}.tpl .lv{display:block;color:var(--mu);font-size:12px;margin:2px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tags i{font-style:normal;font-size:12px;font-weight:700;background:var(--inp);border:1px solid var(--ln);border-radius:20px;padding:3px 10px}
.tpl small{color:var(--mu);font-size:13px;line-height:1.45;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--inp);border:1.5px solid var(--ln);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600}

.exl{display:grid;gap:8px;margin:10px 0}.exl .ghost{text-align:left}
details.card summary{font-weight:700;cursor:pointer}details.card ul{padding-left:18px;margin:8px 0 0;font-size:14px;line-height:1.55}
details.card p{font-size:13px;color:var(--mu);margin:10px 0 0}
.lks{display:flex;gap:16px;margin:0 0 10px;font-size:13px}.lks a{color:var(--ac);font-weight:700;cursor:pointer;text-decoration:none}
.pl{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);color:var(--mu);font-size:12px;line-height:1.6}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.gl{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:12px;text-align:left;color:var(--tx)}
.gl.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.gl .e{font-size:22px;display:block;margin-bottom:2px}.gl b{display:block;font-size:15px}
.gl small{display:block;color:var(--mu);font-size:12px;margin-top:3px;line-height:1.35}
.tabs{display:flex;gap:6px;margin:14px 0 0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;border-radius:9px;background:transparent;font-weight:700;color:var(--mu);font-size:15px}.tab.on{background:var(--ac);color:#fff}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin:6px 0 4px}
.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bv{font-size:10px;color:var(--mu);margin-bottom:2px;white-space:nowrap}
.bb{width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.bl{display:flex;gap:6px}.bl span{flex:1;text-align:center;font-size:10px;color:var(--mu)}
.wrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--ln)}.wrow:last-child{border:0}
.wrow span:last-child{text-align:right}.wrow i{font-style:normal;font-weight:700}.up{color:#2fa36b}.dn{color:#d64545}
.coach ul{margin:8px 0 0;padding-left:18px;line-height:1.6;font-size:14px}
.sel{width:100%;font-size:16px;padding:10px;margin-bottom:6px}
.ic.cf{width:auto;padding:0 12px;background:#d64545;color:#fff;font-size:13px;font-weight:700}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font-size:12px;color:var(--mu)}.wh b{color:var(--tx);font-size:14px}
.px{display:flex;gap:8px;align-items:stretch}.px .ghost{text-align:left}.px i{font-style:normal;color:var(--mu);font-size:12px;font-weight:400;margin-left:4px}
.ph{display:flex;align-items:center;justify-content:center;width:46px;flex:none;border:1.5px solid var(--ln);border-radius:10px;text-decoration:none;font-size:18px;background:var(--inp)}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.5}
.msg.u{background:var(--ac);color:#fff;margin-left:28px}.msg.a{background:var(--inp);border:1px solid var(--ln);margin-right:18px}
#chat{max-height:360px;overflow:auto}
</style>

ipertrofia:{e:"💪",n:"Ipertrofia",d:"Massa e pompa · 10-9-8 rip",h:"Massa e pompa: circa 10-9-8 ripetizioni sulle serie, recuperi da 1 a 2:30.",wm:10,wu:`<b>Riscaldamento (10 min):</b><br>1. Manubri da 1 kg: alzate laterali, frontali, posteriori, croci e lat machine (se possibile). Poi ripeti tutto: 2 giri in tutto.<br>2. Primo allungamento.<br>3. Avvicinamento al primo macchinario, 4 serie: peso crescente da 10, 7 e 4 ripetizioni, più 1 serie con il peso con cui parti. Dopo ogni serie fai un allungamento.<br>4. Poi parti con le serie vere.`,tips:["<b>3 giorni:</b> Push · riposo · Pull · riposo · Gambe","<b>6 giorni:</b> Push · Pull · Gambe, poi ripeti","Non allenare lo stesso gruppo in giorni consecutivi: lascia almeno 48 ore.","Parti dagli esercizi grandi (chest press, squat, lat machine) e finisci con quelli piccoli (bicipiti, tricipiti, addome).","<b>Un'ora:</b> riscaldamento 10 min · parte principale 45-50 min.","<b>Recuperi:</b> esercizi principali 2-2:30 minuti, complementari 60-90 secondi. Il timer parte quando tocchi ✓ accanto alla serie.","<b>Ripetizioni:</b> circa 10-9-8 sulle tre serie. Scegli un carico che ti lascia al massimo 1-2 ripetizioni in riserva, con esecuzione controllata.","Con carichi alti usa i fermi di sicurezza del rack o chiedi uno spotter, e non sacrificare la tecnica."]},

async function aiAsk(mode){

      }
      save();$('#chat').innerHTML=chatHTML();
    }else{
      $('#aiplan').innerHTML='<div class="card"><p class="hint" style="margin:0">🧩 Sto preparando la tua scheda… può servire qualche secondo.</p></div>';
      try{

  const cs=cur(),allowed=cs&&cs.tpl?tplGroups(cs.goal||'ipertrofia',cs.tpl):Object.keys(GR),tplKey=cs&&cs.tpl?cs.tpl:null;
  const row=x=>{const n=exn(x),t=ext(x);return `<div class="px"><button class="ghost" data-a="pex" data-n="${esc(n)}">+ ${esc(n)}${t?` <i>${t}</i>`:''}</button><a class="ph" href="${gl(n,'i')}" data-q="i" data-n="${esc(n)}" ${IOS?'':'target="_blank" '}rel="noopener" aria-label="Foto">📷</a></div>`};
  if(q){const r=[];allowed.forEach(k=>GR[k]&&GR[k].e.forEach(x=>{if(tplExerciseAllowed(tplKey,exn(x))&&(exn(x).toLowerCase().includes(q)||ext(x).includes(q)||k.toLowerCase().includes(q)))r.push(x)}));
    return r.length?`<div class="exl">${r.map(row).join('')}</div>`:'<p class="hint">Nessun risultato in questa scheda: prova con un altro nome.</p>'}
  const g=p.g&&allowed.includes(p.g)&&GR[p.g];

  return `<p class="hint">Si abbina bene con: ${g.p.map(k=>`<button class="chip sm" data-a="pg" data-g="${esc(k)}">${esc(k)}</button>`).join(' ')}<br>${esc(g.t)}</p><div class="exl">${g.e.filter(x=>tplExerciseAllowed(tplKey,exn(x))).map(row).join('')}</div>`;
}
function pickCard(p,title,swapIdx){

function render(){

function tick(){

  const b=document.querySelector(`.chk[data-e="${S.run.e}"][data-s="${S.run.s}"]`);
  if(b&&S.cur===S.run.id)b.textContent='✓ '+mmss(l);

  if(t)t.done=true;

  if(sound)alarm();
}

function copySummary(s){
  const t=stats(s);
  let x=(s.name||'Allenamento')+' – '+fd(s.date)+'\n';
  s.exercises.forEach(e=>{const sets=e.sets.filter(t=>t.kg!==''||t.reps!=='').map(t=>(t.kg||'0')+'×'+(t.reps||'0'));
    if(e.name.trim())x+=e.name.trim()+': '+(sets.join(', ')||'-')+'\n'});
  if(t.vol)x+='Volume: '+Math.round(t.vol)+' kg\n';
  if(s.notes)x+='Note: '+s.notes+'\n';
  const ok=()=>toast('Riepilogo copiato');
  try{navigator.clipboard.writeText(x).then(ok,()=>fb())}catch(e){fb()}
  function fb(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copia non disponibile')}a.remove()}
}
(async()=>{try{AI=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){AI=null}if(AI===undefined)AI=null;if(!S.cur&&S.tab==='help')render()})();
if(S.run){Date.now()>=S.run.end?finish(false):(tInt=setInterval(tick,250))}
(async()=>{const {data}=await sb.auth.getSession();AUTH_USER=data.session&&data.session.user;if(AUTH_USER)render();else showLogin();sb.auth.onAuthStateChange((_e,session)=>{AUTH_USER=session&&session.user;if(!AUTH_USER)showLogin();});})();
</script>
